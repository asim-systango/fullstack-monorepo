name: Deploy & Release Verification

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  validate-release:
    name: Validate Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck Workspace
        run: pnpm typecheck
      - name: Lint Workspace
        run: pnpm lint
      - name: Test Workspace
        run: pnpm test
      - name: Build Monorepo Bundles
        run: pnpm build
        env:
          NODE_ENV: production
          API_GATEWAY_URL: http://localhost:3001
          NEXT_PUBLIC_API_URL: /api

  container-build-check:
    name: Verify Container Image Builds
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate API Gateway Dockerfile
        run: docker build -t gateway:test -f docker/Dockerfile.gateway .
      - name: Validate Domain API Dockerfile
        run: docker build -t api:test -f docker/Dockerfile.api .
      - name: Validate Web App Dockerfile
        run: docker build -t web:test -f docker/Dockerfile.web .
