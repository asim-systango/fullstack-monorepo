name: Deploy

# Build verify on main; optional Vercel/Railway deploys on manual dispatch when secrets exist.
# Topology & env: docs/architecture.md § Deploy (Vercel + Railway)
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Production web build
        env:
          API_GATEWAY_URL: https://example-gateway.up.railway.app
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_WS_URL: https://example-api.up.railway.app
          NEXT_PUBLIC_CSP_CONNECT_SRC: https://example-api.up.railway.app wss://example-api.up.railway.app
        run: pnpm --filter @app/web build
      - name: Docker build (api + gateway)
        run: |
          docker build -f docker/Dockerfile.api -t taskflow-api:ci .
          docker build -f docker/Dockerfile.gateway -t taskflow-gateway:ci .

  deploy-vercel:
    name: Deploy web (Vercel)
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Skip: set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID repository secrets."
            exit 0
          fi
          npm i -g vercel@39
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-railway:
    name: Deploy API stack (Railway)
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Railway up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Skip: set RAILWAY_TOKEN repository secret and link services in Railway."
            exit 0
          fi
          npm i -g @railway/cli
          railway up --service api --detach
          railway up --service api-gateway --detach
